services:
  workflowy-mcp:
    build: .
    container_name: workflowy-mcp
    restart: unless-stopped
    environment:
      - WF_MCP_PORT=3399
      - WF_MCP_PUBLIC_PORT=3001
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - workflowy_data:/root/.workflowy
    healthcheck:
      test: ["CMD", "wf", "account:current", "--agent"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  workflowy_data:
